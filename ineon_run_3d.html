<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Run 3D</title>
  <style>
    :root{
      --bg1:#050816;
      --bg2:#101b3d;
      --cyan:#00e5ff;
      --pink:#ff4fd8;
      --green:#2cff7a;
      --yellow:#ffd54a;
      --panel:rgba(10,15,30,.92);
      --stroke:rgba(0,229,255,.35);
      --white:#fff;
      --danger:#ff5c7a;
    }

    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      font-family:Arial, Helvetica, sans-serif;
      touch-action:none;
      -webkit-user-select:none;
      user-select:none;
    }

    canvas{
      display:block;
      width:100vw;
      height:100vh;
    }

    .hud{
      position:fixed;
      top:10px;
      left:0;
      width:100%;
      display:flex;
      justify-content:space-between;
      padding:0 12px;
      box-sizing:border-box;
      color:var(--white);
      font-size:15px;
      font-weight:700;
      text-shadow:0 0 10px rgba(0,229,255,.8);
      z-index:6;
      pointer-events:none;
      gap:6px;
      flex-wrap:wrap;
    }

    .hud span{
      background:rgba(0,0,0,.22);
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(6px);
      white-space:nowrap;
    }

    .overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at center, rgba(0,0,0,.35), rgba(0,0,0,.7));
      z-index:10;
      padding:18px;
      box-sizing:border-box;
    }

    .panel{
      width:100%;
      max-width:360px;
      padding:24px 20px;
      border-radius:22px;
      background:var(--panel);
      border:1px solid var(--stroke);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 20px 60px rgba(0,0,0,.45),
        0 0 30px rgba(0,229,255,.12);
      color:white;
      text-align:center;
    }

    .title{
      font-size:30px;
      font-weight:900;
      letter-spacing:.5px;
      color:var(--cyan);
      text-shadow:0 0 18px rgba(0,229,255,.45);
      margin-bottom:10px;
    }

    .subtitle{
      font-size:15px;
      line-height:1.6;
      opacity:.95;
      color:rgba(255,255,255,.92);
    }

    .btnRow{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .btn{
      display:inline-block;
      padding:12px 18px;
      border-radius:14px;
      font-size:16px;
      font-weight:800;
      color:#00111f;
      background:linear-gradient(180deg,#6af3ff,#00d4ff);
      box-shadow:
        0 8px 22px rgba(0,212,255,.28),
        0 0 0 1px rgba(255,255,255,.25) inset;
      min-width:120px;
      text-align:center;
    }

    .btn.secondary{
      background:linear-gradient(180deg,#ffd56a,#ffb700);
      color:#251500;
    }

    .btn.danger{
      background:linear-gradient(180deg,#ff89a0,#ff5c7a);
      color:#2a0010;
    }

    .hint{
      position:fixed;
      bottom:12px;
      left:0;
      width:100%;
      text-align:center;
      color:rgba(255,255,255,.72);
      font-size:14px;
      z-index:6;
      pointer-events:none;
    }

    .pauseBtn{
      position:fixed;
      right:12px;
      top:58px;
      z-index:7;
      background:rgba(0,0,0,.25);
      color:white;
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:10px 14px;
      font-weight:800;
      backdrop-filter:blur(6px);
    }
  </style>
</head>
<body>
  <div class="hud">
    <span id="score">Счёт: 0</span>
    <span id="coins">Монеты: 0</span>
    <span id="record">Рекорд: 0</span>
    <span id="power">Щит: 0 | Магнит: 0 | Ускорение: 0</span>
  </div>

  <button id="pauseBtn" class="pauseBtn" style="display:none;">Пауза</button>

  <div id="overlay" class="overlay">
    <div class="panel" id="overlayPanel">
      <div class="title">Neon Run 3D</div>
